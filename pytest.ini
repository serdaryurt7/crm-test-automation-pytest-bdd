[pytest]
bdd_features_base_dir = features/
testpaths = steps
python_files = test_*.py
python_functions = test_*
pythonpath = .
markers =
    lockout: demo hesabini gercekten 15 dakika kilitler, varsayilan calistirmadan haric tutulur (pytest -m lockout ile calistirilir)
addopts = --html=reports/report.html --self-contained-html --alluredir=reports/allure-results --clean-alluredir -m "not lockout"
