[pytest]
bdd_features_base_dir = features/
testpaths = steps
python_files = test_*.py
python_functions = test_*
pythonpath = .
markers =
    lockout: "admin-crm" hesabini GERCEKTEN 15 dakika kilitler; varsayilan kosumdan haric tutulur (bilincli calistirmak icin: pytest -m lockout)
# --strict-markers : yazim hatali/tanimsiz bir marker sessizce yok sayilmak
#                    yerine HATA verir. Bir marker'in yanlis yazilmasi,
#                    "-m not lockout" gibi filtrelerin sessizce etkisiz
#                    kalmasina yol acar - bu projede tam olarak bu yasandi.
# -ra              : sonda kasitli kirmizi/flaky ozetini gorunur kilar.
# --tb=short       : uzun Selenium yigin izlerini kisaltir; asil assert
#                    satiri kaybolmaz.
addopts = --html=reports/report.html --self-contained-html --alluredir=reports/allure-results --clean-alluredir -m "not lockout" --strict-markers -ra --tb=short
